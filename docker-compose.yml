version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: dpd_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: dark_patterns
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dpd_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/dark_patterns
      API_URL: http://localhost:8000
      SECRET_KEY: production-secret-key-replace-in-env
      DEBUG: "False"
      MODEL_PATH: ml/models/dark-pattern-distilbert
      ML_WEIGHT: 0.60
      RULE_WEIGHT: 0.40
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
